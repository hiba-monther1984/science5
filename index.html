<style>
:root{--bg:#f3f8fb;--card:#fff;--ink:#17323f;--mute:#5a7584;--line:#d3e3ec;--acc:#1f7a8c;--chip:#e3f1f6;--ok:#1b9a5a;--bad:#d9423e;--hd:#13525f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a20;--card:#16262e;--ink:#e6f2f7;--mute:#9db9c6;--line:#2a4350;--acc:#4cc2d9;--chip:#1e3640;--hd:#0b3a45}}
:root[data-theme="dark"]{--bg:#0e1a20;--card:#16262e;--ink:#e6f2f7;--mute:#9db9c6;--line:#2a4350;--acc:#4cc2d9;--chip:#1e3640;--hd:#0b3a45}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',Tahoma,Arial,sans-serif;line-height:1.6}
header{background:var(--hd);color:#fff;text-align:center;padding:12px 12px 10px}
header .cr{font-weight:800;font-size:1.05rem}
header .tt{opacity:.85;font-size:.9rem}
main{max-width:600px;margin:0 auto;padding:14px}
.stats{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px;margin-bottom:12px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
h2{font-size:1.1rem;margin:14px 0 8px}h3{margin:0 0 6px;font-size:1.05rem}
button{font-family:inherit;font-size:1rem;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:12px;padding:8px 12px;cursor:pointer;min-height:44px}
button.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
button:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ls{display:flex;gap:12px;align-items:center;width:100%;text-align:right;margin-bottom:8px;padding:12px}
.ls .e{font-size:1.8rem}.ls small{display:block;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
svg{width:100%;height:auto;display:block;background:var(--card);border:2px solid var(--line);border-radius:12px}
.fb{min-height:1.5em;font-weight:700;margin:6px 0}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.note{color:var(--mute);margin:6px 0}
.tag{display:inline-block;background:var(--chip);border-radius:10px;padding:2px 10px;margin:2px;color:var(--mute)}
.pl{padding:8px 10px;border-right:4px solid var(--acc);background:var(--chip);border-radius:8px;margin:6px 0}
table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid var(--line);padding:6px;text-align:center}
[data-p]{cursor:pointer}[data-p]:hover{opacity:.85}
#toast{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:8px 18px;border-radius:20px;font-weight:800;opacity:0;transition:.3s;pointer-events:none}
#toast.s{opacity:1}

.cert{border:6px double var(--acc);border-radius:18px;padding:22px 16px;text-align:center;background:var(--card);margin:12px 0}
.cert h2{font-size:1.6rem;color:var(--acc);margin:0 0 8px}
.cert .nm{font-size:1.5rem;font-weight:800;border-bottom:2px dashed var(--line);display:inline-block;min-width:60%;margin:8px 0;padding:2px 10px}
.cert .sg{display:flex;justify-content:space-between;margin-top:18px;color:var(--mute);font-size:.95rem}
input[type=text]{font-family:inherit;font-size:1.1rem;width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.bar{height:12px;background:var(--chip);border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--acc)}
@media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:absolute;top:0;left:0;width:100%}}

.hero{background:linear-gradient(135deg,#13525f,#2a9d8f);color:#fff;border-radius:22px;padding:16px;text-align:center;margin-bottom:14px}
.hero .hi{font-size:1.2rem;font-weight:800}.hero .sub2{opacity:.85;margin-bottom:6px}
.rg{position:relative;width:170px;height:170px;margin:0 auto}.rg .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.9rem;font-weight:800;line-height:1.1}.rg .ctr small{font-size:.65rem;font-weight:400;opacity:.85;max-width:80px}
.lg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin:8px 0;font-size:.85rem}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:5px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.chips span{background:rgba(255,255,255,.18);border-radius:20px;padding:4px 12px;font-weight:700}
h2.sm{font-size:1.15rem;background:var(--hd);color:#fff;padding:8px 14px;border-radius:14px;margin-top:20px}
h3.un{font-size:1rem;margin:14px 4px 6px;color:var(--mute)}
.ls{border-radius:18px}.ls .e{font-size:1.6rem;background:var(--chip);border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.wk{display:flex;gap:6px;align-items:flex-end;height:130px;margin-top:10px}.col{flex:1;text-align:center}.bb{background:var(--line);border-radius:8px 8px 4px 4px}.bv{font-size:.75rem;color:var(--mute);min-height:1.1em}.bd{font-size:.75rem;color:var(--mute);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.gc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;font-size:1.6rem;display:flex;flex-direction:column;align-items:center;gap:2px}.gc b{font-size:1.3rem}.gc small{font-size:.8rem;color:var(--mute)}.gc.lk{opacity:.45}
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
#nav button{flex:1;border:none;background:none;border-radius:0;display:flex;flex-direction:column;align-items:center;font-size:1.3rem;padding:6px 0;min-height:54px;color:var(--mute)}#nav button small{font-size:.7rem}#nav button.on{color:var(--acc);font-weight:800;background:none}
main{padding-bottom:84px}

.sim{background:linear-gradient(var(--sk1),var(--sk2));touch-action:none}.sim text,.sim circle{pointer-events:none}
:root{--sk1:#cfe8ff;--sk2:#f2f9ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sk1:#1a3550;--sk2:#10222f}}
.pn{background:var(--chip);border:2px solid var(--line);border-radius:14px;padding:8px 12px;margin:10px 0}
.rb label{display:block;padding:5px 2px;cursor:pointer}.rb input{width:20px;height:20px;vertical-align:middle;margin-left:6px;accent-color:var(--acc)}
.rs{background:#f5a623;color:#fff;border-radius:50%;width:52px;height:52px;font-size:1.5rem;font-weight:800;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);padding:0}
</style>

<header><div class="cr">إعداد وتصميم المعلمة: هبه منذر نجار</div><div class="tt">محاكيات العلوم والحياة – الصف الخامس<br><small>أرقام الصفحات حسب ترقيم الكتاب المطبوع لكل فصل</small></div></header>
<main>
<div class="stats"><span id="sp">⭐ 0</span><span id="sb">🏅 0</span><button id="mt" aria-label="الصوت" style="min-height:36px;padding:2px 10px">🔊</button></div>
<div id="app"></div>

<script>
let S={pts:0,done:{},n:{}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('sci5')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('sci5',JSON.stringify(S))}catch(e){}};
const app=document.getElementById('app');
const mk=(h)=>{const d=document.createElement('div');d.innerHTML=h;return d};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.className='s';setTimeout(()=>t.className='',1400)}
function stats(){
 const b=LS.filter(l=>l.acts.every(a=>S.done[a[0]])).length;
 document.getElementById('sp').textContent='⭐ '+S.pts+' نقطة  ('+Math.floor(S.pts/30)+' نجوم)';
 document.getElementById('sb').textContent='🏅 '+b+' شارات';document.getElementById('mt').textContent=S.mute?'🔇':'🔊';
}
function gain(k,p,cap){S.n[k]=S.n[k]||0;if(S.n[k]>=cap)return;S.n[k]++;S.pts+=p;S.ps=S.ps||{1:S.pts-p};S.ps[CUR]=(S.ps[CUR]||0)+p;S.dp=S.dp||{};S.dp[today()]=(S.dp[today()]||0)+p;save();stats();toast('+'+p+' نقاط 🎉')}
function fin(a){if(!S.done[a]){S.done[a]=1;save();stats();toast('أنجزتِ النشاط! 🌟');setTimeout(sWin,450);banner(a)}}
function banner(a){if(!CURL||!CURB||!CURL.acts[CURI]||CURL.acts[CURI][0]!==a||!CURB.isConnected||CURB.querySelector('.done-b'))return;
 const last=CURI+1>=CURL.acts.length,d=mk('<div class="pl done-b" style="background:var(--chip);border-right-color:var(--ok);font-weight:800">🌟 أنهيتِ هذا النشاط! '+(last?'أحسنتِ، هذا آخر نشاط في الدرس.':'انتقلي إلى النشاط التالي.')+'</div>').firstElementChild;
 const bt=document.createElement('button');bt.className='on';bt.style.marginTop='8px';bt.textContent=last?'🏠 العودة إلى القائمة':'النشاط التالي ◀';bt.onclick=()=>{if(last){home();stats()}else lesson(CURL,CURI+1)};
 d.appendChild(document.createElement('br'));d.appendChild(bt);CURB.appendChild(d);try{d.scrollIntoView({behavior:'smooth',block:'center'})}catch(e){}}
let AC=null,CUR=1,CS=1,CURL=null,CURI=0,CURB=null;
function snd(n){if(S.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();let at=AC.currentTime;
 n.forEach(([f,d,ty])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(.18,at+.02);g.gain.exponentialRampToValueAtTime(.001,at+d);o.connect(g);g.connect(AC.destination);o.start(at);o.stop(at+d+.02);at+=d*.8})}catch(e){}}
const sOk=()=>snd([[523,.14],[659,.14],[784,.28]]),sBad=()=>snd([[260,.18,'triangle'],[200,.3,'triangle']]),sWin=()=>snd([[523,.15],[659,.15],[784,.15],[1047,.45]]);
const say=(e,m,ok)=>{e.textContent=m;e.className='fb '+(ok?'ok':'bad');ok?sOk():sBad()};
function mcq(box,q,opts,ans,key,onRight){
 const t0=opts[ans];opts=opts.slice().sort(()=>Math.random()-.5);ans=opts.indexOf(t0);
 const d=mk(`<div class="pl"><b>${q}</b></div><div class="row"></div><div class="fb"></div>`);
 const r=d.children[1],f=d.children[2];
 opts.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{
  if(i===ans){say(f,'إجابة صحيحة! أحسنتِ ✅',1);gain(key,10,1);r.querySelectorAll('button').forEach(x=>x.disabled=1);onRight&&onRight()}
  else say(f,'حاولي مرة أخرى 🔎',0)};r.appendChild(b)});
 [...d.children].forEach(c=>box.appendChild(c));
}
function order(box,items,key,pts,onDone){
 const sh=items.map((x,i)=>[x,i]).sort(()=>Math.random()-.5),placed=mk('<div></div>').firstElementChild,f=mk('<div class="fb"></div>').firstElementChild,r=mk('<div class="row"></div>').firstElementChild;
 let k=0;
 sh.forEach(([x,i])=>{const b=document.createElement('button');b.textContent=x.t;b.onclick=()=>{
  if(i===k){k++;b.disabled=1;placed.appendChild(mk(`<div class="pl">${k}) ${x.t} <span class="tag">${x.h}</span></div>`).firstElementChild);say(f,'ترتيب صحيح ✅',1);
   if(k===items.length){gain(key,pts,1);onDone()}}
  else say(f,'ليس هذا هو الترتيب الصحيح، فكّري مرة أخرى 🔎',0)};r.appendChild(b)});
 box.append(r,f,placed);

function F1(b){
 b.innerHTML='<div class="pl">اسحبي الدولاب بإصبعك في حركة دائرية لتديريه، أو اضغطي «دوّري». راقبي المصباح: متى يضيء؟ ومتى ينطفئ؟</div><svg viewBox="0 0 658 598" id="sv" class="sim" style="touch-action:none"><defs><radialGradient id="gl"><stop offset="0" stop-color="#fff9b0" stop-opacity="1"/><stop offset=".5" stop-color="#ffe14d" stop-opacity=".7"/><stop offset="1" stop-color="#ffd000" stop-opacity="0"/></radialGradient></defs></svg><div class="pn"><b>سرعة الدولاب</b><div style="height:14px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0"><div id="bar" style="height:100%;width:0;background:var(--acc)"></div></div><div class="row"><button id="spn">🔄 دوّري</button><button id="stp">⏹ أوقفي</button></div><label style="display:block;margin-top:6px"><input type="checkbox" id="lb" style="width:20px;height:20px;vertical-align:middle;margin-left:6px"> إظهار أسماء الأجزاء</label></div><div class="pn" id="m" style="font-weight:700;min-height:4em"></div><div id="G"></div>';
 const sv=b.querySelector('#sv'),mm=b.querySelector('#m'),LB=b.querySelector('#lb');
 const CX=545,CY=225,RX=48,RY=118,TILT=22*Math.PI/180;let th=0,w=0,drag=0,la=0,asked=0,seenB=0,seenOff=0;
 const rot=(u,v)=>[CX+u*Math.cos(TILT)-v*Math.sin(TILT),CY+u*Math.sin(TILT)+v*Math.cos(TILT)];
 function loop(){if(!b.isConnected)return;if(!drag){w*=.985;if(Math.abs(w)<.002)w=0;th+=w}
  const br=Math.min(1,Math.abs(w)/.3);
  let s=`<defs><radialGradient id="gl"><stop offset="0" stop-color="#fff9b0"/><stop offset=".5" stop-color="#ffe14d" stop-opacity=".7"/><stop offset="1" stop-color="#ffd000" stop-opacity="0"/></radialGradient></defs><image href="${GENIMG}" x="0" y="0" width="658" height="598"/>`;
  [0,2.094,4.188].forEach(o=>{const a=th+o,[x,y]=rot(Math.cos(a)*RX*.72,Math.sin(a)*RY*.72);s+=`<circle cx="${x}" cy="${y}" r="9" fill="#ffd84d" stroke="#7a5a00" stroke-width="2"/>`});
  if(br>0)s+=`<circle cx="190" cy="350" r="${30+br*50}" fill="url(#gl)" opacity="${.15+br*.85}"/>`;
  if(br>.25)for(let i=0;i<5;i++){const a=th*3+i*1.26;s+=`<circle cx="${322+Math.cos(a)*16}" cy="${380+Math.sin(a)*10}" r="3" fill="#ffb300" opacity="${br}"/>`}
  if(LB.checked){const L=[['دولاب',[560,75],[552,112]],['مغناطيس',[110,470],[232,440]],['ملف',[300,300],[320,368]],['محور الدوران',[470,520],[372,430]],['مصباح',[110,300],[182,343]]];
   L.forEach(([t,p,q])=>{s+=`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="#111" stroke-width="3"/><circle cx="${q[0]}" cy="${q[1]}" r="5" fill="#111"/><text x="${p[0]}" y="${p[1]-6}" text-anchor="middle" font-size="26" font-weight="800" fill="#fff" stroke="#111" stroke-width="6" paint-order="stroke">${t}</text>`})}
  sv.innerHTML=s;b.querySelector('#bar').style.width=Math.min(100,Math.abs(w)/.3*100)+'%';
  mm.textContent=br>.05?'الدولاب يدور ← يتحرك الملف بين قطبي المغناطيس ← تتولّد كهرباء ← يضيء المصباح (حركية ← كهربائية ← ضوئية).':'الدولاب ساكن: لا يتحرك الملف ولا تتولّد كهرباء، فالمصباح مطفأ.';
  if(br>.8)seenB=1;if(seenB&&br<.03)seenOff=1;
  if(seenB&&seenOff&&!asked){asked=1;fin('f1');grps(b.querySelector('#G'),'f1q',[['المولّد الكهربائي',[['تتحول الطاقة في المولّد من:',['حركية إلى كهربائية ثم ضوئية','ضوئية إلى حركية','حرارية إلى كيميائية'],0,'f1a'],['تتولد الكهرباء نتيجة:',['حركة الملف بين قطبي المغناطيس','سكون الملف','وزن الدولاب'],0,'f1b'],['عند إيقاف الدولاب ينطفئ المصباح لأن:',['الملف لا يتحرك فلا تتولد كهرباء','المصباح ينفد','المغناطيس يضعف'],0,'f1c'],['كلما زادت سرعة تدوير الدولاب:',['زادت إضاءة المصباح','قلّت إضاءة المصباح','لم تتغيّر'],0,'f1d'],['من أجزاء المولّد:',['دولاب ومغناطيس وملف ومحور دوران ومصباح','موقد وقدر','مرآة وعدسة'],0,'f1e']]]])}
  requestAnimationFrame(loop)}
 const ang=e=>{const p=svp(sv,e);return Math.atan2(p.y-CY,p.x-CX)};
 const onW=e=>{const p=svp(sv,e),u=p.x-CX,v=p.y-CY,c=Math.cos(-TILT),s2=Math.sin(-TILT),x=u*c-v*s2,y=u*s2+v*c;return (x*x)/(RX*RX*1.8)+(y*y)/(RY*RY*1.2)<1};
 sv.onpointerdown=e=>{if(onW(e)){drag=1;la=ang(e);sv.setPointerCapture(e.pointerId)}};
 sv.onpointermove=e=>{if(!drag)return;const a=ang(e);let d=a-la;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;la=a;th+=d;w=w*.6+d*.4;w=Math.max(-.6,Math.min(.6,w))};
 sv.onpointerup=sv.onpointercancel=()=>{drag=0};
 b.querySelector('#spn').onclick=()=>{w=Math.min(.5,Math.abs(w)+.12)};b.querySelector('#stp').onclick=()=>{w=0};loop();
}

 b.innerHTML='<div class="pl">اسحبي الكرة إلى أي موضع على المسار ثم اتركيها. راقبي أعمدة الطاقة: ماذا يحدث لطاقة الوضع والحركة؟ جرّبي مع الاحتكاك وبدونه.</div><svg viewBox="0 0 360 290" id="sv" class="sim" style="touch-action:none"></svg><div class="pn"><label><input type="checkbox" id="fr" style="width:20px;height:20px;vertical-align:middle;margin-left:6px"> إضافة الاحتكاك</label><div>الكتلة: <b id="mv">2</b> كغ<input type="range" id="ms" min="1" max="5" value="2" style="width:100%;direction:ltr"></div><div class="row"><button class="rs" id="rs" aria-label="إعادة">↺</button></div></div><div class="pn" id="m" style="font-weight:700;min-height:3em"></div><div id="G"></div>';

 const g=9.8,k=2.5,X0=150,SX=130,Y0=250,SY=26;let x=-.8,v=0,drag=0,E0=0,rel=0,asked=0;const seen={};

 function setE(){E0=m()*g*z(x)}

 const sv=b.querySelector('#sv'),T=b.querySelector('#t'),mm=b.querySelector('#m');let run=0,t0=0,xw=40,xo=40,asked=0,last=0,seen={};

 function loop(now){if(!b.isConnected)return;const dt=Math.min(.05,(now-last)/1000||0);last=now;

   if(xw>=X1&&xo>=X1){run=0;seen.done=1}}

 b.querySelector('#go').onclick=()=>{if(xw>=X1&&xo>=X1){xw=X0;xo=X0}run=1};

async function dl(blob,fn){
 let d=null;try{d=window.claude&&await claude.use('downloads')}catch(e){}
 if(d){try{await d.save({filename:fn,data:blob});toast('تم الحفظ ✅')}catch(e){if(!e||e.code!=='declined')toast('تعذّر الحفظ، جرّبي لقطة شاشة 📸')}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('تم الحفظ ✅');
}

function home(){
 setNav('h');app.innerHTML='';
 const A1=ALL(1),A2=ALL(2),d1=A1.filter(a=>S.done[a[0]]).length,d2=A2.filter(a=>S.done[a[0]]).length,AL=ALL(),dn=d1+d2;
 const p1=d1/A1.length,p2=A2.length?d2/A2.length:0,p3=(S.pts%30)/30,badges=LS.filter(l=>l.acts.every(a=>S.done[a[0]])).length;
 const L=[['الفصل الأول','#3b82f6',p1],['الفصل الثاني','#22c55e',p2],['النجمة القادمة','#f59e0b',p3]];
 app.appendChild(mk(`<div class="hero"><div class="hi">مرحبًا ${S.name||'يا عالِمة المستقبل'} 👋</div><div class="sub2">حلقات إنجازك اليوم</div><div class="rg">${rings(L.map(x=>[x[2],x[1]]))}<div class="ctr">${Math.round(dn/AL.length*100)}%<small>من الأنشطة المتاحة</small></div></div><div class="lg">${L.map(x=>`<span><i style="background:${x[1]}"></i>${x[0]} ${Math.round(x[2]*100)}%</span>`).join('')}</div><div class="chips"><span>🔥 ${S.streak||1} يوم متتالٍ</span><span>⭐ ${S.pts}</span><span>🏅 ${badges}</span></div></div>`).firstElementChild);
app.appendChild(mk(`<div class="card" style="display:flex;gap:12px;align-items:center;border-color:var(--acc)"><img src="${DEDIMG}" alt="" style="width:78px;height:78px;flex:none;border-radius:50%;object-fit:cover;border:3px solid var(--acc)"><div style="line-height:1.7"><b>🤲 صدقة جارية</b><br>هذا العمل صدقة جارية عن روح والدي الشهيد <b>منذر ناجي عبد الله</b>، رحمه الله وتقبّله مع الشهداء وأسكنه فسيح جناته.<br><small>اللهم اغفر له وارحمه، واجعل هذا العلم النافع في ميزان حسناته.</small></div></div>`).firstElementChild);
 [1,2].forEach(sm=>{
  app.appendChild(mk(`<h2 class="sm">${SEMT[sm]}</h2>`).firstElementChild);
  UNITS[sm].forEach(u=>{app.appendChild(mk(`<h3 class="un">${UN[u]}</h3>`).firstElementChild);
   LS.filter(l=>l.u===u).forEach(l=>{const dn=l.acts.filter(a=>S.done[a[0]]).length,pc=Math.round(dn/l.acts.length*100);
    const b=mk(`<button class="ls"><span class="e">${l.e}</span><span style="flex:1"><b>${l.t}</b><small>${dn} من ${l.acts.length} أنشطة ${dn===l.acts.length?'🏅':''}</small><div class="bar" style="height:8px"><i style="width:${pc}%"></i></div></span></button>`).firstElementChild;
    b.onclick=()=>lesson(l,0);app.appendChild(b)});
   (SOON[u]||[]).forEach(x=>app.appendChild(mk(`<button class="ls" disabled><span class="e">🔒</span><span><b>${x}</b><small>قريبًا</small></span></button>`).firstElementChild))})});
}
const WD=o=>{const d=new Date();d.setDate(d.getDate()-o);return d};
/* تقرير التقدّم للمعلمة */
function repCode(){const done=ALL().filter(a=>S.done[a[0]]).map(a=>a[0]);const o={v:1,n:(S.name||'').trim(),d:new Date().toISOString().slice(0,10),p:S.pts,s:S.streak||1,a:done};return 'SCI5.'+btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function repText(){const A1=ALL(1),A2=ALL(2),d1=A1.filter(a=>S.done[a[0]]).length,d2=A2.filter(a=>S.done[a[0]]).length;
 return '📊 تقرير تقدّم – العلوم والحياة (الصف الخامس)\nالطالبة: '+(S.name||'—')+'\nالتاريخ: '+new Date().toLocaleDateString('ar')+'\nالنقاط: '+S.pts+' | الأنشطة المنجزة: '+(d1+d2)+' من '+(A1.length+A2.length)+'\nالفصل الأول: '+Math.round(d1/A1.length*100)+'% | الفصل الثاني: '+Math.round(d2/A2.length*100)+'%\n\nرمز التقرير (للمعلمة):\n'+repCode()}
function report(){
 const c=mk('<div class="card"><h3>📤 تقريري للمعلمة</h3><p class="note">اكتبي اسمك ثم أرسلي التقرير لمعلمتك ليتابع تقدّمك.</p><input type="text" id="rn" placeholder="اكتبي اسمك الكامل" maxlength="40"><div class="row" style="margin-top:8px"><button id="rc">📋 نسخ التقرير</button><button id="rsh">📤 مشاركة</button><button id="rw">💬 واتساب</button></div><pre id="rt" style="white-space:pre-wrap;word-break:break-all;background:var(--chip);border-radius:12px;padding:10px;font-family:inherit;font-size:.85rem;margin:8px 0 0"></pre></div>').firstElementChild;
 const inp=c.querySelector('#rn'),pre=c.querySelector('#rt');inp.value=S.name||'';
 const upd=()=>{S.name=inp.value;save();pre.textContent=repText()};inp.oninput=upd;upd();
 const need=()=>{if(!S.name||!S.name.trim()){toast('اكتبي اسمك أولًا ✍️');return true}return false};
 c.querySelector('#rc').onclick=async()=>{if(need())return;const t=repText();try{await navigator.clipboard.writeText(t);toast('تم النسخ ✅')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('تم النسخ ✅')}catch(e2){toast('انسخي النص يدويًا')}ta.remove()}};
 c.querySelector('#rsh').onclick=async()=>{if(need())return;try{await navigator.share({text:repText()})}catch(e){}};
 c.querySelector('#rw').onclick=()=>{if(need())return;window.open('https://wa.me/?text='+encodeURIComponent(repText()),'_blank')};
 app.appendChild(c);
}
function prog(){
 setNav('p');app.innerHTML='';
 const days=[6,5,4,3,2,1,0].map(o=>[o,(S.dp&&S.dp[dkey(o)])||0]),mx=Math.max(10,...days.map(x=>x[1]));
 const bars=days.map(([o,v])=>`<div class="col"><div class="bv">${v||''}</div><div class="bb" style="height:${Math.round(v/mx*90)+4}px;${o===0?'background:var(--acc)':''}"></div><div class="bd">${WD(o).toLocaleDateString('ar',{weekday:'short'})}</div></div>`).join('');
 const dn=ALL().filter(a=>S.done[a[0]]).length;
 app.appendChild(mk(`<h2>📊 إنجازاتي</h2><div class="card"><b>نقاطي خلال الأسبوع</b><div class="wk">${bars}</div></div><div class="grid"><div class="gc">⭐<b>${S.pts}</b><small>نقطة</small></div><div class="gc">🌟<b>${Math.floor(S.pts/30)}</b><small>نجمة</small></div><div class="gc">🔥<b>${S.streak||1}</b><small>يوم متتالٍ</small></div><div class="gc">✅<b>${dn}</b><small>نشاط مكتمل</small></div></div><h2>🏅 شاراتي</h2><div class="grid" id="bd"></div>`));
 const bd=app.querySelector('#bd');LS.forEach(l=>{const ok=l.acts.every(a=>S.done[a[0]]);bd.appendChild(mk(`<div class="gc ${ok?'':'lk'}">${ok?l.e:'🔒'}<small>${l.t}</small></div>`).firstElementChild)});
 report();
}
function certs(){
 setNav('c');app.innerHTML='<h2>🏆 شهاداتي</h2>';
 [1,2].forEach(sm=>{const A=ALL(sm),dn=A.filter(a=>S.done[a[0]]).length,pd=PEND(sm),ok=dn===A.length&&!pd;
  const c=mk(`<div class="card"><b>${SEMT[sm]}</b><div class="bar"><i style="width:${Math.round(dn/A.length*100)}%"></i></div><p class="note">${dn} من ${A.length} نشاطًا${pd?' — تبقى '+pd+' دروس':''}</p><button class="${ok?'on':''}">${ok?'🎓 افتحي شهادتك':'🔒 تفاصيل التقدم'}</button></div>`).firstElementChild;
  c.querySelector('button').onclick=()=>cert(sm);app.appendChild(c)});
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>({h:home,p:prog,c:certs})[b.dataset.t]());
function lesson(l,i){CUR=SM(l);
 app.innerHTML='';
 const bk=document.createElement('button');bk.textContent='→ القائمة الرئيسية';bk.onclick=()=>{home();stats()};app.appendChild(bk);
 app.appendChild(mk(`<h2>${l.e} ${l.t}</h2>`).firstElementChild);
 const tabs=mk('<div class="row"></div>').firstElementChild,body=mk('<div class="card"></div>').firstElementChild;
 l.acts.forEach((a,j)=>{const x=document.createElement('button');x.textContent=(S.done[a[0]]?'✅ ':'')+a[1];if(j===i)x.classList.add('on');x.onclick=()=>lesson(l,j);tabs.appendChild(x)});
 app.append(tabs,body);CURL=l;CURI=i;CURB=body;body.appendChild(mk(`<h3>${l.acts[i][1]}</h3>`).firstElementChild);
 const inner=document.createElement('div');body.appendChild(inner);l.acts[i][2](inner);
}
document.getElementById('mt').onclick=()=>{S.mute=!S.mute;save();stats();if(!S.mute)sOk()};
stats();home();
try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&!/claude\.ai|claudeusercontent/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
